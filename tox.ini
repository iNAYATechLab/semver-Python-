[tox]
isolated_build = True
envlist = py39, py310, py311, py312, py313, lint

[testenv]
allowlist_externals = pytest
commands =
    pytest tests/ {posargs}

[testenv:lint]
deps =
    black
    flake8
    isort
commands =
    flake8 semver tests
    black --check semver tests
    isort --check-only --settings-path pyproject.toml semver tests
