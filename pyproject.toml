[tool.poetry]
name = "poetry-semver"
version = "0.1.0"
description = "A semantic versioning library for Python"
authors = ["Sébastien Eustace <sebastien@eustace.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/python-poetry/semver"
repository = "https://github.com/python-poetry/semver"

packages = [
    {include = "semver"},
    {include = "tests", format = "sdist"},
]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
tox = "^4.24"
pre-commit = "^4.1"

[tool.isort]
line_length = 88
force_single_line = true
atomic = true
include_trailing_comma = true
# -1 keeps the blank lines after the import block as they are, which is what
# keeps isort and black from fighting over them.
lines_after_imports = -1
lines_between_types = 1
multi_line_output = 3
use_parentheses = true
known_first_party = "semver"
known_third_party = [
    "pytest",
]
filter_files = true


[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
